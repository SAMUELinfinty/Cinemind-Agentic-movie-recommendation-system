# CineMind local production run. MongoDB stays on Atlas (no local DB container).
# Secrets come from the shell environment or provider dashboards — never committed.
#   $env:MONGODB_URI="..."; $env:INTERNAL_API_KEY="..."; $env:JWT_SECRET="..."
#   $env:OPENROUTER_API_KEY="..."; $env:OPENROUTER_MODEL="..."; docker compose up --build

services:
  movies:
    build: ./services/movies
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: cinemind
      MONGODB_COLLECTION: movies
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    build: ./services/agent
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MOVIES_SERVICE_URL: http://movies:8002
      EXPRESS_API_URL: http://api:5000
      LLM_TIMEOUT_S: "30.0"
      MOVIES_TIMEOUT_S: "10.0"
    depends_on:
      movies:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./services/api
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MOVIES_SERVICE_URL: http://movies:8002
      AGENT_SERVICE_URL: http://agent:8001
      AGENT_TIMEOUT_MS: "45000"
      MOVIES_TIMEOUT_MS: "15000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      movies:
        condition: service_healthy
      agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
